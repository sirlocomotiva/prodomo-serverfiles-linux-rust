# PostgreSQL 18 and the `prodomo` server, for Podman or Docker Compose.
#
# Before the first start:
#
#   1. Put the store password in `.env` beside this file (it is ignored by Git):
#          POSTGRES_PASSWORD=<your password>
#   2. Copy `config/prodomo.toml.example` to `prodomo.toml` (ignored by Git) and set:
#          public_ip   = the address players reach this machine on
#          [store].url = "postgres://prodomo:<your password>@postgres:5432/prodomo"
#      Leave `game_data` and `game_tables` as they are: `legacy/` is mounted where they point.
#   3. Start it:
#          podman compose up -d --build        (or: docker compose up -d --build)
#
# Operator commands run in a one-off container against the same store:
#
#   podman compose run --rm prodomo account create alice
#   podman compose run --rm prodomo gm grant alice Admin implementor
#
# The server stops on SIGTERM and saves every character first; `stop_grace_period` gives it time.
# Stop it with `compose stop` or `compose down`, then `compose up -d`. Do not use
# `compose restart`: through Podman's Docker-compatible API it ended the server without the
# SIGTERM (ledger 680), so the characters in the game would not get their last save.

name: prodomo

services:
  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: prodomo
      POSTGRES_DB: prodomo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodomo -d prodomo"]
      interval: 5s
      timeout: 3s
      retries: 20

  prodomo:
    build:
      context: .
      dockerfile: Dockerfile
    image: prodomo:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PRODOMO_CONFIG:-./prodomo.toml}:/etc/prodomo/prodomo.toml:ro
      - ./legacy:/srv/prodomo/legacy:ro
      - logs:/srv/prodomo/log
    ports:
      # The legacy ports the client's `serverinfo` names: auth, Channel 1 (both of its legacy
      # Core ports), and the Shared Channel. Set PRODOMO_BIND to publish on one address only.
      - "${PRODOMO_BIND:-0.0.0.0}:30001:30001"
      - "${PRODOMO_BIND:-0.0.0.0}:30003:30003"
      - "${PRODOMO_BIND:-0.0.0.0}:30005:30005"
      - "${PRODOMO_BIND:-0.0.0.0}:30019:30019"
    stop_grace_period: 60s

volumes:
  pgdata:
  logs:
